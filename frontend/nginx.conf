# Same-origin deployment: the SPA and the API share one host, so the refresh-token cookie stays
# SameSite=Strict and no CORS is needed in production. Put TLS in front (see docs/deployment.md).
upstream erp_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    server_tokens off;

    # Repeated in every location that sets its own headers (nginx does not inherit add_header there).
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location ~ ^/(api|admin|static|health)/ {
        proxy_pass http://erp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    # Uploaded media is served only through authenticated API endpoints, never directly.
    location /media/ { return 404; }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
